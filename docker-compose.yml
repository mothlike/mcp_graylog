services:
  mcp-graylog:
    build: .
    container_name: mcp-graylog-server
    ports:
      - "8000:8000"
    environment:
      GRAYLOG_ENDPOINT: ${GRAYLOG_ENDPOINT}
      GRAYLOG_TOKEN: ${GRAYLOG_TOKEN}
      GRAYLOG_USERNAME: ${GRAYLOG_USERNAME:-}
      GRAYLOG_PASSWORD: ${GRAYLOG_PASSWORD:-}
      GRAYLOG_VERIFY_SSL: ${GRAYLOG_VERIFY_SSL:-true}
      GRAYLOG_TIMEOUT: ${GRAYLOG_TIMEOUT:-30}
      MCP_SERVER_DNS_REBINDING_PROTECTION: ${MCP_SERVER_DNS_REBINDING_PROTECTION:-true}
      MCP_SERVER_ALLOWED_HOSTS: "${MCP_SERVER_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*}"
      MCP_SERVER_ALLOWED_ORIGINS: "${MCP_SERVER_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*,http://[::1]:*}"
    restart: unless-stopped
